name: Post no LinkedIn ao mergear PR

on:
  # Dispara em PR mergeado neste próprio repositório
  pull_request:
    types: [closed]
    branches: [main]

  # Dispara quando outro repositório avisa (via repository_dispatch)
  # que teve um PR mergeado por lá
  repository_dispatch:
    types: [pr-merged]

jobs:
  post-to-linkedin:
    # Roda se: (a) foi um PR local de fato mergeado, OU (b) veio de outro repo via dispatch
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true) ||
      github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install google-genai requests

      - name: Gerar texto do post com Gemini
        id: generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REPO_NAME: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.repo_name || github.repository }}
          REPO_URL: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.repo_url || format('https://github.com/{0}', github.repository) }}
          PR_TITLE: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.pr_title || github.event.pull_request.title }}
          PR_BODY: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.pr_body || github.event.pull_request.body }}
          COMMIT_MESSAGES: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.pr_title || github.event.pull_request.title }}
          CHANGED_FILES: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.changed_files || github.event.pull_request.changed_files }}
        run: |
          POST_TEXT=$(python generate_post.py)
          echo "post_text<<EOF" >> "$GITHUB_OUTPUT"
          echo "$POST_TEXT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Publicar no LinkedIn
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          POST_TEXT: ${{ steps.generate.outputs.post_text }}
        run: python post_linkedin.py
